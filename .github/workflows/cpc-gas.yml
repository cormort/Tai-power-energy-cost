name: 更新中油天然氣牌價與台電燃料用量

on:
  schedule:
    # 台灣時間每天 09:00；中油每月 1 日調價、能源署月資料發布日不固定，無變動就不會 commit
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch_cpc_gas.py
        continue-on-error: true
      - run: python3 scripts/fetch_taipower_fuel.py
        continue-on-error: true
      - run: python3 scripts/fetch_energy_prices.py
        continue-on-error: true
      - run: python3 scripts/fetch_taipower_accounts.py
        continue-on-error: true
      - name: Commit if changed
        run: |
          git diff --quiet data/ && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "data: 更新中油牌價／台電燃料用量 $(date -u +%Y-%m-%d)"
          git push
